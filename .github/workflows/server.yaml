name: server

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  merge_group:
    branches: [ main ]

jobs:
  server-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.11'

      - name: Set up cargo cache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        continue-on-error: false
        with:
          path: |
            ~/.local/share/pypoetry/
            server/target/
          key: ${{ runner.os }}-python-${{ hashFiles('server/poetry.lock') }}
          restore-keys: ${{ runner.os }}-python-

      - name: Install poetry & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry --version
          poetry install -vv -C ./server -n

      - name: Black formatting check
        run: |
          poetry run -C ./server black --check --verbose ./server

      - name: Pylint check
        run: |
          poetry run -C ./server pylint $(git ls-files './server/**/*.py')
